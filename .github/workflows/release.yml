name: Release build

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt
        env:
          PYTHONUTF8: '1'

      - name: Run tests (offscreen)
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --clean AimLoot.spec
        env:
          PYTHONUTF8: '1'

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/AimLoot/AimLoot.exe')) { throw 'AimLoot.exe missing' }
          $size = (Get-ChildItem 'dist/AimLoot' -Recurse | Measure-Object Length -Sum).Sum
          if ($size -lt 50MB) { throw "Artifact suspiciously small: $size bytes" }
          Write-Host "OK: $([math]::Round($size / 1MB, 1)) MB"

      - name: Zip onedir
        shell: pwsh
        run: Compress-Archive -Path 'dist/AimLoot' -DestinationPath "AimLoot-$env:GITHUB_REF_NAME.zip" -Force

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: AimLoot ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: AimLoot-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
